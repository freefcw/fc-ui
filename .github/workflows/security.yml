name: Security

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        # Fail on unsound advisories, which are actionable in this repo.
        # `unmaintained` is left as a warning: all current entries come from the
        # fc-gpui dependency chain and cannot be resolved here. `yanked` is left
        # as a warning too: `spin 0.9.8` is reachable only through
        # fc-gpui-linux/fc-gpui-windows, so it never affects macOS builds.
        run: cargo audit --deny unsound
