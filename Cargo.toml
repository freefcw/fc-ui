[package]
name = "fc-ui"
version = "0.9.0"
edition = "2021"
authors = ["fc-ui Team"]
license = "MIT"
description = "A comprehensive, professional UI component library for GPUI inspired by shadcn/ui. 85+ polished components for building beautiful desktop applications."
repository = "https://github.com/freefcw/fc-ui"
homepage = "https://github.com/freefcw/fc-ui"
documentation = "https://docs.rs/fc-ui"
readme = "README.md"
keywords = ["gpui", "ui", "gui", "components", "desktop"]
categories = ["gui", "rendering"]
rust-version = "1.90"
exclude = ["assets/icons/**/*", "assets/audio/**/*", "assets/images/**/*"]

[lib]
name = "fc_ui"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Core Framework
gpui = { package = "fc-gpui", version = "0.11.0", default-features = false, features = ["font-kit", "wayland", "x11", "windows-manifest"] }
smallvec = "1.13.2"

# Text Processing
unicode-segmentation = "1.12"
regex = "1.10"

# Async Runtime
smol = "2.0.2"
futures = "0.3"

# HTTP client for remote images (optional)
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["blocking", "charset", "http2", "macos-system-configuration", "rustls-tls-native-roots"], optional = true }

# QR Code generation
qrcode = { version = "0.14", optional = true }

# Rope data structure for editor
ropey = { version = "1.6", optional = true }

# Syntax Highlighting (tree-sitter based)
tree-sitter = { version = "0.25.10", optional = true }

# Language grammars (optional, behind feature flags)
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.6", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-lua = { version = "0.4", optional = true }
tree-sitter-zig = { version = "1.1", optional = true }
tree-sitter-scala = { version = "0.24", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-ocaml = { version = "0.24", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }

# Markdown parsing (optional)
pulldown-cmark = { version = "0.13", default-features = false, optional = true }

# HTML parsing (optional)
html5ever = { version = "0.38", optional = true }
markup5ever_rcdom = { version = "0.38", optional = true }

# Audio playback (optional)
rodio = { version = "0.22", default-features = false, features = ["playback", "flac", "mp3", "vorbis", "wav"], optional = true }

[dev-dependencies]
gpui = { package = "fc-gpui", version = "0.11.0", default-features = false, features = ["image-format-jpeg", "test-support"] }
anyhow = "1.0"
image = { version = "0.25", default-features = false }
serde_json = "1.0"

[features]
default = [
    "accessibility",
    "http",
    "bundled-fonts",
    "image-format-png",
    "image-format-jpeg",
]
accessibility = ["gpui/accessibility"]
http = ["reqwest"]
markdown = ["pulldown-cmark"]
html-render = ["html5ever", "markup5ever_rcdom"]
audio = ["rodio"]
qrcode = ["dep:qrcode"]
editor = ["dep:ropey", "dep:tree-sitter"]
image-default-formats = [
    "image-format-avif",
    "image-format-bmp",
    "image-format-dds",
    "image-format-exr",
    "image-format-farbfeld",
    "image-format-gif",
    "image-format-hdr",
    "image-format-ico",
    "image-format-jpeg",
    "image-format-png",
    "image-format-pnm",
    "image-format-qoi",
    "image-format-tga",
    "image-format-tiff",
    "image-format-webp",
]
image-format-avif = ["gpui/image-format-avif"]
image-format-bmp = ["gpui/image-format-bmp"]
image-format-dds = ["gpui/image-format-dds"]
image-format-exr = ["gpui/image-format-exr"]
image-format-farbfeld = ["gpui/image-format-farbfeld"]
image-format-gif = ["gpui/image-format-gif"]
image-format-hdr = ["gpui/image-format-hdr"]
image-format-ico = ["gpui/image-format-ico"]
image-format-jpeg = ["gpui/image-format-jpeg"]
image-format-png = ["gpui/image-format-png"]
image-format-pnm = ["gpui/image-format-pnm"]
image-format-qoi = ["gpui/image-format-qoi"]
image-format-tga = ["gpui/image-format-tga"]
image-format-tiff = ["gpui/image-format-tiff"]
image-format-webp = ["gpui/image-format-webp"]
image-rayon = ["gpui/image-rayon"]
editor-languages = [
    "editor",
    "tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-typescript",
    "tree-sitter-python", "tree-sitter-json", "tree-sitter-toml-ng",
    "tree-sitter-md", "tree-sitter-go", "tree-sitter-c", "tree-sitter-cpp",
    "tree-sitter-java", "tree-sitter-ruby", "tree-sitter-bash",
    "tree-sitter-css", "tree-sitter-html", "tree-sitter-yaml",
    "tree-sitter-lua", "tree-sitter-zig", "tree-sitter-scala",
    "tree-sitter-php", "tree-sitter-ocaml",
    "tree-sitter-sequel",
]

# Bundled font features
bundled-fonts = ["bundled-fonts-inter", "bundled-fonts-mono-full"]
bundled-fonts-inter = ["font-inter-regular", "font-inter-medium", "font-inter-semibold", "font-inter-bold"]
bundled-fonts-inter-minimal = ["font-inter-regular", "font-inter-semibold"]
bundled-fonts-mono = ["font-mono-regular"]
bundled-fonts-mono-full = ["font-mono-regular", "font-mono-bold"]
# Individual font weight features
font-inter-regular = []
font-inter-medium = []
font-inter-semibold = []
font-inter-bold = []
font-mono-regular = []
font-mono-bold = []

[[test]]
name = "real_visual_smoke"
path = "tests/real_visual_smoke.rs"
harness = false

[[test]]
name = "accessibility"
path = "tests/accessibility.rs"
required-features = ["accessibility"]

[[example]]
name = "markdown_demo"
path = "examples/markdown_demo.rs"
required-features = ["markdown"]

[[example]]
name = "html_demo"
path = "examples/html_demo.rs"
required-features = ["html-render"]

[[example]]
name = "components_showcase"
path = "examples/components_showcase.rs"
required-features = ["qrcode"]

[[example]]
name = "editor_demo"
path = "examples/editor_demo.rs"
required-features = ["editor", "editor-languages"]

[[example]]
name = "editor_scroll_test"
path = "examples/editor_scroll_test.rs"
required-features = ["editor"]

[[example]]
name = "editor_styled_demo"
path = "examples/editor_styled_demo.rs"
required-features = ["editor"]
